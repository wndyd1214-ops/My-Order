<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>인생맥주 실시간 발주</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <style>
        :root { --bg-color: #1a1a1a; --card-bg: #262626; --color-juyong: #3498db; --color-mingu: #ff6b81; --color-sujeong: #b2bec3; --neon-pink: #ff007f; --gold: #d4af37; --point-red: #ff4d4d; }
        body { background-color: var(--bg-color); color: #e0e0e0; font-family: 'Pretendard', sans-serif; display: flex; justify-content: center; padding: 50px 0; margin: 0; position: relative; }
        .container { width: 450px; background: var(--card-bg); padding: 30px; border-radius: 40px; border: 3px solid var(--gold); position: relative; }
        
        .settings-btn { position: absolute; top: 25px; right: 25px; background: none; border: none; color: var(--gold); font-size: 28px; cursor: pointer; transition: 0.3s; z-index: 10; }
        .settings-btn:hover { transform: rotate(90deg); color: #fff; }

        .title { font-size: 50px; font-weight: 900; color: #fff; text-align: center; margin-bottom: 25px; text-shadow: 0 0 15px var(--neon-pink); }
        
        .search-wrapper { margin-bottom: 25px; position: relative; }
        .search-input { width: 100%; background: #111; border: 2px solid #444; padding: 12px 15px 12px 40px; border-radius: 15px; color: #fff; font-size: 16px; box-sizing: border-box; transition: 0.3s; }
        .search-input:focus { border-color: var(--gold); box-shadow: 0 0 10px rgba(212,175,55,0.3); outline: none; }
        .search-icon { position: absolute; left: 15px; top: 14px; color: #666; font-size: 16px; }

        .user-nav { display: flex; justify-content: space-around; margin-bottom: 25px; border-bottom: 2px solid #444; padding-bottom: 15px; }
        .nav-item { cursor: pointer; padding: 8px 20px; font-weight: bold; font-size: 18px; border-radius: 15px; transition: 0.3s; opacity: 0.5; }
        .nav-item.active { opacity: 1; transform: scale(1.1); }
        .nav-item[data-user="juyong"] { color: var(--color-juyong); }
        .nav-item[data-user="mingu"] { color: var(--color-mingu); }
        .nav-item[data-user="sujeong"] { color: var(--color-sujeong); }
        .nav-item.active[data-user="juyong"] { background: var(--color-juyong); color: white; }
        .nav-item.active[data-user="mingu"] { background: var(--color-mingu); color: white; }
        .nav-item.active[data-user="sujeong"] { background: var(--color-sujeong); color: white; }
        
        .cat-block { margin-bottom: 12px; background: #1f1f1f; border-radius: 16px; border: 1px solid #333; overflow: hidden; }
        .cat-header { background: #111; color: var(--gold); font-size: 16px; padding: 15px 20px; font-weight: bold; cursor: pointer; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #222; transition: 0.2s; -webkit-user-select: none; user-select: none; }
        .cat-header:hover { background: #151515; }
        .cat-icon { font-size: 12px; color: #666; transition: 0.3s; }
        .cat-body { display: none; padding: 10px; background: #1e1e1e; }
        
        .item-row { background: #111; border-radius: 12px; padding: 10px 15px; margin-bottom: 6px; display: flex; justify-content: space-between; align-items: center; border: 1px solid #333; }
        .item-row.highlight { border-color: var(--gold); }
        .star-red { color: var(--point-red); font-weight: bold; margin-left: 2px; }
        .item-row input { background: #222; border: 1px solid #444; border-radius: 5px; color: white; text-align: right; width: 90px; padding: 8px; font-size: 16px; }
        
        .sticky-footer { margin-top: 30px; }
        .btn-group-bottom { display: flex; gap: 10px; margin-bottom: 15px; }
        .btn-dark { flex: 1; padding: 15px; border-radius: 15px; border: 2px solid var(--gold); background: #111; color: var(--gold); font-weight: bold; cursor: pointer; font-size: 16px; }
        .confirm-wrapper { text-align: center; margin-bottom: 20px; }
        .btn-confirm { padding: 12px 40px; border-radius: 30px; border: none; cursor: pointer; font-weight: bold; color: white; background: #333; transition: 0.3s; }
        .btn-confirm.on { background: #007bff; box-shadow: 0 0 20px #007bff; }
        .result-box { background: #000; min-height: 150px; border-radius: 20px; padding: 20px; border: 2px solid #333; line-height: 1.8; }
        .res-group { margin-bottom: 20px; padding: 5px 10px; border-radius: 10px; }
        .res-item { font-size: 15px; font-weight: 500; }
        .text-juyong { color: var(--color-juyong); border-left: 4px solid var(--color-juyong); }
        .text-mingu { color: var(--color-mingu); border-left: 4px solid var(--color-mingu); }
        .text-sujeong { color: var(--color-sujeong); border-left: 4px solid var(--color-sujeong); }
        .badge-add { color: #f1c40f; font-weight: bold; font-size: 13px; }

        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); justify-content: center; align-items: center; z-index: 100; }
        .modal-content { background: #222; width: 420px; max-height: 80vh; overflow-y: auto; padding: 25px; border-radius: 20px; border: 2px solid var(--gold); box-shadow: 0 0 20px rgba(212,175,55,0.3); }
        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; border-bottom: 1px solid #444; padding-bottom: 10px; }
        .modal-title { font-size: 20px; font-weight: bold; color: var(--gold); }
        .close-btn { background: none; border: none; color: #fff; font-size: 24px; cursor: pointer; }
        .form-group { margin-bottom: 15px; display: flex; flex-direction: column; gap: 8px; }
        .form-group label { font-size: 14px; color: #bbb; }
        .form-group select, .form-group input { background: #111; border: 1px solid #444; padding: 10px; border-radius: 8px; color: #fff; font-size: 15px; }
        .btn-add-item { background: var(--gold); color: #000; border: none; padding: 12px; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 15px; margin-top: 5px; }
        .manage-list { margin-top: 20px; border-top: 1px solid #444; padding-top: 15px; }
        .manage-item-row { display: flex; justify-content: space-between; align-items: center; background: #111; padding: 8px 12px; margin-bottom: 5px; border-radius: 6px; font-size: 14px; }
        .manage-actions { display: flex; gap: 5px; }
        .btn-edit-item { background: #27ae60; color: white; border: none; padding: 4px 8px; border-radius: 4px; cursor: pointer; font-size: 12px; }
        .btn-del-item { background: var(--point-red); color: white; border: none; padding: 4px 8px; border-radius: 4px; cursor: pointer; font-size: 12px; }
        
        /* 📜 히스토리 UI 스타일 디자인 */
        .history-section { border-top: 2px dashed #444; margin-top: 25px; padding-top: 20px; }
        .history-title { font-size: 15px; color: var(--gold); font-weight: bold; margin-bottom: 12px; display: flex; align-items: center; gap: 5px; }
        .history-container { background: #111; border-radius: 10px; padding: 15px; max-height: 250px; overflow-y: auto; font-size: 13px; line-height: 1.6; border: 1px solid #333; }
        .history-date-group { margin-bottom: 15px; border-bottom: 1px solid #222; padding-bottom: 10px; }
        .history-date-title { color: #f1c40f; font-weight: bold; margin-bottom: 5px; font-size: 13px; }
        .history-log-line { color: #ccc; padding-left: 5px; margin-bottom: 3px; }
        .user-tag-juyong { color: var(--color-juyong); font-weight: bold; }
        .user-tag-mingu { color: var(--color-mingu); font-weight: bold; }
        .user-tag-sujeong { color: var(--color-sujeong); font-weight: bold; }
    </style>
</head>
<body>
<div class="container">
    <button class="settings-btn" onclick="openModal()">⚙️</button>
    
    <h1 class="title">인생맥주</h1>

    <div class="search-wrapper">
        <span class="search-icon">🔍</span>
        <input type="text" id="searchInput" class="search-input" placeholder="필요한 식재료 품목 검색..." oninput="filterMenu()">
    </div>

    <nav class="user-nav">
        <span class="nav-item active" data-user="juyong" onclick="setUser('juyong', this)">주용</span>
        <span class="nav-item" data-user="mingu" onclick="setUser('mingu', this)">민구</span>
        <span class="nav-item" data-user="sujeong" onclick="setUser('sujeong', this)">수정</span>
    </nav>

    <div id="item-list"></div>

    <div class="sticky-footer">
        <div class="btn-group-bottom">
            <button class="btn-dark" onclick="addOrder()">ORDER</button>
            <button class="btn-dark" onclick="copyResult()">COPY</button>
            <button class="btn-dark" onclick="resetAll()">RESET</button>
        </div>
        <div class="confirm-wrapper">
            <button id="cfBtn" class="btn-confirm" onclick="toggleCf()">주문확인</button>
        </div>
        <div class="result-box" id="resArea">
            <div style="color:#666; text-align:center; padding-top:50px;">연결 중...</div>
        </div>
    </div>
</div>

<div class="modal" id="settingsModal">
    <div class="modal-content">
        <div class="modal-header">
            <div class="modal-title">⚙️ 발주 리스트 품목 설정</div>
            <button class="close-btn" onclick="closeModal()">×</button>
        </div>
        <div class="form-group">
            <label>1. 카테고리(탭) 선택</label>
            <select id="modalCatSelect"></select>
        </div>
        <div class="form-group">
            <label>2. 추가할 품목 이름 입력</label>
            <input type="text" id="modalItemInput" placeholder="예: 새로, 진로, 생맥통 등">
        </div>
        <button class="btn-add-item" onclick="addNewItem()">리스트에 품목 추가하기</button>

        <div class="manage-list">
            <div style="font-size: 14px; color: var(--gold); margin-bottom: 10px; font-weight: bold;">📋 현재 등록된 품목 편집/삭제 관리</div>
            <div id="manageItemsArea"></div>
        </div>

        <div class="history-section">
            <div class="history-title">📜 최근 일주일(7일) 발주 히스토리 기록</div>
            <div class="history-container" id="historyViewArea">
                <div style="color:#666; text-align:center; padding-top:20px;">불러오는 중...</div>
            </div>
        </div>
    </div>
</div>

<script>
    const firebaseConfig = { databaseURL: "https://my-order-d3713-default-rtdb.firebaseio.com" };
    
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    const orderRef = db.ref('orders');
    const statusRef = db.ref('confirmStatus');
    const historyRef = db.ref('history'); // 히스토리 전용 파이어베이스 경로

    const defaultMenuData = {
        "🐔 육류 / 닭 관련": ["계육(5개/박스)", "순살치킨", "테바나카(닭날개)", "닭껍질튀김", "닭발"],
        "🐷 돼지고기 / 소고기류": ["돈삼겹슬라이스", "우삼겹", "민찌", "부대찌개햄"],
        "🐟 수산물 / 해산물 / 어묵류": ["바지락", "홍합", "불꽃오징어", "반건조오징어", "양념먹태", "손질먹태 70g", "손질먹태 130g", "튀김쥐포", "장쥐포", "교자만두", "부산어묵사각", "꼬치어묵"],
        "🍟 튀김 / 감자 / 간식류": ["미국식치즈스틱", "길감자(20개/박스)", "모듬감자 (최소20봉)", "스트레이트컷", "시즌드배터드후라이즈", "포테이토칩", "모듬소시지", "말발굽소시지", "왕돈까스", "타코야끼", "호떡", "멕시칸불고기피자", "마카로니 과자"],
        "🍢 꼬치류": ["염통꼬치", "은행꼬치", "물떡꼬치"],
        "🍜 면 / 떡 / 곡류": ["밀떡볶이", "인절미떡", "칼국수면", "쌀국수면", "우동면", "사리면", "당면", "분모자", "짜빠게티", "불닭볶음면", "항아리김치수제비 원팩"],
        "🧂 양념 / 소스 / 조미료": ["미숫가루", "뿌링클시즈닝", "위벨롭시즈닝", "허니버터맛시즈닝", "쌀국수분말", "미원", "혼다시", "맛소금", "후추가루", "파슬리", "소고기다시다", "건고추", "참깨", "설탕", "부침가루", "튀김가루", "멸치육수", "돼지불고기양념", "초고추장", "양조간장", "굵은고춧가루", "고운고춧가루(매운맛)", "빠이탄", "우동다시", "물엿", "케찹", "치폴레소스", "양념치킨소스", "매운데리야끼", "불닭소스", "불닭마요소스", "렌치 드레싱", "꼬치양념소스", "칠리소스", "떡볶이소스", "머스타드", "크리미버터소스", "퐁듀치즈소스", "데리야끼", "마요네즈", "돈가스소스", "아카시아청", "올리브유", "식용유", "참기름", "들기름"],
        "🧀 치즈 / 유제품": ["눈꽃치즈", "체다슬라이스치즈", "아이스크림", "연유", "크림"],
        "🧄 채소 / 신선식품": ["대파", "양파", "감자", "숙주", "홍고추", "청양고추", "새송이버섯", "계란", "다진마늘", "양배추"],
        "🧃 디저트 / 음료": ["파인애플샤베트", "파인애플"],
        "🧻 소모품 / 위생용품": ["유산지", "치킨박스", "호일", "키친타올", "일회용비닐봉투", "음식물쓰레기봉투", "철수세미", "목장갑"],
        "🧼 세제 / 청소용품": ["락스", "퐁퐁", "식기세척기 세제(분홍색)", "식기세척기 린스 (파란색)"],
        "🥜 기타 식재료": ["피땅콩", "줄줄이김", "가쓰오부시", "치킨무", "김가루"],
        "🍽 포장용기": ["냉면용기", "사각용기 12개짜리", "사각용기 8개짜리", "소스종지", "종이봉투", "전용기", "배달 포장봉지 중", "배달 포장봉지 소"]
    };

    let menuData = JSON.parse(localStorage.getItem('insaengMenuData')) || defaultMenuData;
    let currentUser = 'juyong';
    const userColors = { juyong: 'text-juyong', mingu: 'text-mingu', sujeong: 'text-sujeong' };
    const userNames = { juyong: '주용', mingu: '민구', sujeong: '수정' };

    function renderItemList() {
        const itemList = document.getElementById('item-list');
        itemList.innerHTML = "";
        
        let catIndex = 0;
        for (let cat in menuData) {
            if(menuData[cat].length === 0) continue;
            
            let block = document.createElement('div');
            block.className = 'cat-block';
            block.id = `catBlock-${catIndex}`;
            
            block.innerHTML = `
                <div class="cat-header" onclick="toggleCategory(${catIndex})">
                    <span>${cat}</span>
                    <span class="cat-icon" id="catIcon-${catIndex}">▼</span>
                </div>
                <div class="cat-body" id="catBody-${catIndex}"></div>
            `;
            
            const body = block.querySelector(`#catBody-${catIndex}`);
            menuData[cat].forEach(it => {
                let starLabel = (it.includes("밀떡볶이") || it.includes("계육")) ? "<span class='star-red'>★</span>" : "";
                let r = document.createElement('div');
                r.className = 'item-row';
                r.setAttribute('data-item-name', it);
                r.innerHTML = `<label>${it}${starLabel}</label><input type="text" id="input-${it}" placeholder="0">`;
                body.appendChild(r);
            });
            
            itemList.appendChild(block);
            catIndex++;
        }
    }

    function toggleCategory(index) {
        const body = document.getElementById(`catBody-${index}`);
        const icon = document.getElementById(`catIcon-${index}`);
        if (body.style.display === 'block') {
            body.style.display = 'none';
            icon.innerText = '▼';
            icon.style.color = '#666';
        } else {
            body.style.display = 'block';
            icon.innerText = '▲';
            icon.style.color = 'var(--gold)';
        }
    }

    function filterMenu() {
        const query = document.getElementById('searchInput').value.toLowerCase().trim();
        const blocks = document.querySelectorAll('.cat-block');
        
        blocks.forEach(block => {
            const body = block.querySelector('.cat-body');
            const icon = block.querySelector('.cat-icon');
            const rows = block.querySelectorAll('.item-row');
            let hasVisibleItem = false;
            
            rows.forEach(row => {
                const itemName = row.getAttribute('data-item-name').toLowerCase();
                if (itemName.includes(query)) {
                    row.style.display = 'flex';
                    if (query !== "") {
                        row.classList.add('highlight');
                    } else {
                        row.classList.remove('highlight');
                    }
                    hasVisibleItem = true;
                } else {
                    row.style.display = 'none';
                    row.classList.remove('highlight');
                }
            });
            
            if (query === "") {
                body.style.display = 'none';
                block.style.display = 'block';
                icon.innerText = '▼';
                icon.style.color = '#666';
            } else {
                if (hasVisibleItem) {
                    block.style.display = 'block';
                    body.style.display = 'block';
                    icon.innerText = '▲';
                    icon.style.color = 'var(--gold)';
                } else {
                    block.style.display = 'none';
                }
            }
        });
    }

    // 🕒 타임스탬프 포맷 가공 기능 (오후 04:15 형태)
    function formatTime(timestamp) {
        const d = new Date(timestamp);
        let hrs = d.getHours();
        const mins = String(d.getMinutes()).padStart(2, '0');
        const ampm = hrs >= 12 ? '오후' : '오전';
        hrs = hrs % 12;
        hrs = hrs ? hrs : 12; 
        return `${ampm} ${String(hrs).padStart(2, '0')}:${mins}`;
    }

    // 📅 날짜 가공 기능 (2026-06-15 월요일 형태)
    function formatDate(timestamp) {
        const d = new Date(timestamp);
        const year = d.getFullYear();
        const month = String(d.getMonth() + 1).padStart(2, '0');
        const date = String(d.getDate()).padStart(2, '0');
        const week = ['일', '월', '화', '수', '목', '금', '토'][d.getDay()];
        return `${year}-${month}-${date} (${week}요일)`;
    }

    function initModalContents() {
        const select = document.getElementById('modalCatSelect');
        select.innerHTML = "";
        const manageArea = document.getElementById('manageItemsArea');
        manageArea.innerHTML = "";

        for (let cat in menuData) {
            let opt = document.createElement('option');
            opt.value = cat;
            opt.innerText = cat;
            select.appendChild(opt);

            menuData[cat].forEach(it => {
                let row = document.createElement('div');
                row.className = 'manage-item-row';
                row.innerHTML = `<span>[${cat.split(' ')[1] || cat}] ${it}</span>
                                 <div class="manage-actions">
                                     <button class="btn-edit-item" onclick="editItem('${cat}', '${it}')">수정</button>
                                     <button class="btn-del-item" onclick="deleteItem('${cat}', '${it}')">삭제</button>
                                 </div>`;
                manageArea.appendChild(row);
            });
        }
        loadHistoryView(); // 모달 켤 때 히스토리 로드
    }

    // 📜 7일치 히스토리 불러와서 화면에 그리기
    function loadHistoryView() {
        const area = document.getElementById('historyViewArea');
        
        historyRef.once('value', (snapshot) => {
            const data = snapshot.val();
            if(!data) {
                area.innerHTML = `<div style="color:#666; text-align:center; padding-top:20px;">기록된 과거 발주 내역이 없습니다.</div>`;
                return;
            }
            
            // 시간 역순 (최신순) 정렬
            const logs = Object.values(data).sort((a,b) => b.timestamp - a.timestamp);
            
            // 날짜별 그룹핑
            const dateGroups = {};
            logs.forEach(log => {
                const dateStr = formatDate(log.timestamp);
                if(!dateGroups[dateStr]) dateGroups[dateStr] = [];
                dateGroups[dateStr].push(log);
            });
            
            area.innerHTML = "";
            for(let date in dateGroups) {
                let groupDiv = document.createElement('div');
                groupDiv.className = 'history-date-group';
                groupDiv.innerHTML = `<div class="history-date-title">📅 ${date}</div>`;
                
                dateGroups[date].forEach(log => {
                    let p = document.createElement('div');
                    p.className = 'history-log-line';
                    const timeStr = formatTime(log.timestamp);
                    p.innerHTML = `[${timeStr}] <span class="user-tag-${log.user}">${userNames[log.user]}</span>: ${log.item} (${log.qty}개)`;
                    groupDiv.appendChild(p);
                });
                area.appendChild(groupDiv);
            }
        });
    }

    // 🚨 [핵심] 일주일(7일)이 지난 히스토리 자동 데이터 청소 기능
    function cleanOldHistory() {
        const ONE_WEEK_MS = 7 * 24 * 60 * 60 * 1000;
        const cutoffTime = Date.now() - ONE_WEEK_MS;
        
        historyRef.once('value', (snapshot) => {
            const data = snapshot.val();
            if(!data) return;
            
            Object.keys(data).forEach(key => {
                if(data[key].timestamp < cutoffTime) {
                    historyRef.child(key).remove(); // 7일 지난 건 파베에서 자동 삭제
                }
            });
        });
    }

    function openModal() {
        initModalContents();
        document.getElementById('settingsModal').style.display = 'flex';
    }
    function closeModal() {
        document.getElementById('settingsModal').style.display = 'none';
    }

    function addNewItem() {
        const cat = document.getElementById('modalCatSelect').value;
        const input = document.getElementById('modalItemInput');
        const newItemName = input.value.trim();

        if(!newItemName) {
            alert("추가할 품목 이름을 입력해주세요!");
            return;
        }
        if(menuData[cat].includes(newItemName)) {
            alert("이미 똑같은 이름의 품목이 존재합니다.");
            return;
        }

        menuData[cat].push(newItemName);
        localStorage.setItem('insaengMenuData', JSON.stringify(menuData));
        
        input.value = "";
        renderItemList();
        initModalContents();
        document.getElementById('searchInput').value = "";
        alert(`'${cat}'에 [${newItemName}] 품목이 추가되었습니다!`);
    }

    function editItem(cat, oldName) {
        const newName = prompt(`[${oldName}]의 변경할 새 이름을 입력하세요:`, oldName);
        if (newName === null) return;
        
        const trimmedName = newName.trim();
        if (!trimmedName) {
            alert("품목 이름은 공백으로 설정할 수 없습니다.");
            return;
        }
        if (oldName === trimmedName) return;

        if (menuData[cat].includes(trimmedName)) {
            alert("이미 해당 카테고리에 똑같은 이름의 품목이 존재합니다.");
            return;
        }

        const idx = menuData[cat].indexOf(oldName);
        if (idx !== -1) {
            menuData[cat][idx] = trimmedName;
            localStorage.setItem('insaengMenuData', JSON.stringify(menuData));
            renderItemList();
            initModalContents();
            document.getElementById('searchInput').value = "";
            alert(`[${oldName}] 품목이 [${trimmedName}](으)로 수정되었습니다!`);
        }
    }

    function deleteItem(cat, itemName) {
        if(confirm(`정말로 [${itemName}] 품목을 발주 리스트에서 삭제하시겠습니까?`)) {
            menuData[cat] = menuData[cat].filter(it => it !== itemName);
            localStorage.setItem('insaengMenuData', JSON.stringify(menuData));
            renderItemList();
            initModalContents();
            document.getElementById('searchInput').value = "";
        }
    }

    function setUser(u, el) {
        currentUser = u;
        document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
        el.classList.add('active');
    }

    function addOrder() {
        let hasValue = false;
        document.querySelectorAll('#item-list input').forEach(input => {
            let v = input.value.trim();
            if (v !== "" && v !== "0") {
                let itemName = input.id.replace('input-', '');
                const orderData = { user: currentUser, item: itemName, qty: v, timestamp: Date.now() };
                
                // 1. 실시간 발주창에 전송
                orderRef.push(orderData);
                // 2. 일주일 백업을 위해 히스토리 DB에도 즉시 더블 아카이빙 저장
                historyRef.push(orderData);

                input.value = "";
                hasValue = true;
            }
        });
        if(!hasValue) alert("수량을 입력해주세요.");
    }

    orderRef.on('value', (snapshot) => {
        const data = snapshot.val();
        const resArea = document.getElementById('resArea');
        resArea.innerHTML = "";
        if (!data) {
            resArea.innerHTML = `<div style="color:#666; text-align:center; padding-top:50px;">발주 내역이 비어있습니다.</div>`;
            return;
        }
        const allOrders = Object.values(data).sort((a, b) => a.timestamp - b.timestamp);
        const userGroups = { juyong: [], mingu: [], sujeong: [] };
        const firstSeenItem = {};
        allOrders.forEach(order => {
            let addTag = firstSeenItem[order.item] ? " <span class='badge-add'>★추가주문</span>" : "";
            firstSeenItem[order.item] = true;
            userGroups[order.user].push(`<div class="res-item">• ${order.item}: ${order.qty}${addTag}</div>`);
        });
        ['juyong', 'mingu', 'sujeong'].forEach(user => {
            if (userGroups[user].length > 0) {
                let userDiv = document.createElement('div');
                userDiv.className = `res-group ${userColors[user]}`;
                userDiv.innerHTML = userGroups[user].join('');
                resArea.appendChild(userDiv);
            }
        });
    });

    statusRef.on('value', (snapshot) => {
        const isConfirmed = snapshot.val();
        const cfBtn = document.getElementById('cfBtn');
        if (isConfirmed) {
            cfBtn.classList.add('on');
            cfBtn.innerText = "확인완료 ✔";
        } else {
            cfBtn.classList.remove('on');
            cfBtn.innerText = "주문확인";
        }
    });

    function toggleCf() {
        statusRef.once('value').then(snap => { statusRef.set(!snap.val()); });
    }

    function copyResult() {
        const resArea = document.getElementById('resArea');
        const textToCopy = resArea.innerText;
        if (textToCopy.includes("비어있습니다") || textToCopy.includes("연결 중")) return;
        navigator.clipboard.writeText(textToCopy).then(() => alert("내역이 복사되었습니다!"));
    }

    function resetAll() {
        if(confirm("실시간 화면만 초기화됩니다.\n(※ 설정창의 7일 히스토리 기록은 안전하게 유지됩니다) \n\n정말로 초기화할까요?")) {
            orderRef.set(null);
            statusRef.set(false);
        }
    }

    // 앱 실행 시 실행 구조
    renderItemList();
    cleanOldHistory(); // 앱 구동될 때마다 옛날 데이터(7일 초과)는 자동 청소 자동 실행
</script>
</body>
</html>
